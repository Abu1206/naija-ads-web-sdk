name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/naija-ads-web-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge-base guard needs main's history, not a shallow tag checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; Node 22 still ships npm 10.
      # No NPM_TOKEN is configured. Configure this exact workflow as the trusted
      # publisher for the `npm` environment in the package settings on npmjs.com.
      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11

      - name: Require a commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Dependency install scripts are not needed by this toolchain. Keeping them
      # disabled reduces the release job's supply-chain attack surface.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run --ignore-scripts

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
