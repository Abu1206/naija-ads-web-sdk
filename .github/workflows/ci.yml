name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (ESM + IIFE + d.ts)
        run: npm run build
      - name: Zero runtime dependencies (AGENTS.md §2)
        run: |
          COUNT=$(node -e "const p=require('./package.json'); console.log(Object.keys(p.dependencies ?? {}).length)")
          if [ "$COUNT" != "0" ]; then echo "runtime dependencies found: $COUNT — not allowed"; exit 1; fi
