name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (ESM + IIFE + d.ts)
        run: npm run build
      - name: Zero runtime dependencies (AGENTS.md §2)
        run: |
          COUNT=$(node -e "const p=require('./package.json'); console.log(Object.keys(p.dependencies ?? {}).length)")
          if [ "$COUNT" != "0" ]; then echo "runtime dependencies found: $COUNT — not allowed"; exit 1; fi
      - name: Package contract
        run: |
          node -e "const p=require('./package.json'); if (p.license !== 'Apache-2.0') throw new Error('license must be Apache-2.0'); if (p.private) throw new Error('package must be publishable');"
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const pack = require('./pack.json')[0];
            const files = new Set(pack.files.map((f) => f.path));
            for (const required of ['LICENSE', 'README.md', 'package.json', 'dist/index.js', 'dist/index.d.ts']) {
              if (!files.has(required)) throw new Error('missing from package: ' + required);
            }
          "
